name: Build OKZ44 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'run: unzip -o OKZ44_GitHub_Build_Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -o OKZ44_Android_App_Project.zip

      - name: Build APK
        working-directory: OKZ44_Android_Project
        run: |
          gradle --version
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKZ44-APK
          path: OKZ44_Android_Project/app/build/outputs/apk/debug/app-debug.apk
