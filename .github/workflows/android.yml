name: OKZ44 Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Project Files
        run: |
          echo "Repository files:"
          ls -la
          find . -maxdepth 3 -type f

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android Project
        run: |
          if [ -f "gradlew" ]; then
            echo "Project found in root"
          elif [ -d "OKZ44_Android_App_Project" ]; then
            cd OKZ44_Android_App_Project
            echo "Project found in folder"
          else
            echo "ERROR: Android project not found!"
            exit 1
          fi

      - name: Build APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "OKZ44_Android_App_Project/gradlew" ]; then
            cd OKZ44_Android_App_Project
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "ERROR: gradlew not found!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKZ44-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
