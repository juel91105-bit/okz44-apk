name: OKZ44 Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP Project
        run: |Run unzip -o OKZ44_Android_App_Project.zip
unzip:  cannot find or open OKZ44_Android_App_Project.zip, OKZ44_Android_App_Project.zip.zip or OKZ44_Android_App_Project.zip.ZIP.
Error: Process completed with exit
          mkdir -p android-project
          unzip -o OKZ44_GitHub_Build_Project.zip -d android-project
          echo "ZIP extracted successfully"
          find android-project -maxdepth 4 -type f

      - name: Find Android Project
        run: |
          PROJECT_DIR=$(find android-project -type f -name gradlew -exec dirname {} \; | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -exec dirname {} \; | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android Gradle project not found in ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project found: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKZ44-Android-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
